name: ai_treasure_hunt
description: "AI-powered personalized treasure hunt exploration app that generates daily adventures and gamifies local exploration."
publish_to: 'none'

version: 1.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.1

  # Navigation
  go_router: ^13.0.0

  # Backend & Cloud
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.0
  firebase_analytics: ^10.7.0
  firebase_crashlytics: ^3.4.0

  # Google Services
  google_sign_in: ^6.1.6
  google_maps_flutter: ^2.5.0
  google_generative_ai: ^0.4.1

  # Location & Maps
  geolocator: ^9.0.2
  geocoding: ^2.1.0
  timezone: ^0.9.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # UI & UX
  google_fonts: ^6.1.0
  lottie: ^2.6.0
  smooth_page_indicator: ^1.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0

  # Utilities
  intl: ^0.19.0
  logger: ^2.0.1
  connectivity_plus: ^5.0.1
  http: ^1.1.0
  dio: ^5.3.1
  url_launcher: ^6.1.14
  image_picker: ^1.0.4
  permission_handler: ^11.4.4
  flutter_dotenv: ^5.1.0

dependencies:
  flutter_test:
    sdk: flutter

  # Testing
  mockito: ^5.4.4
  build_runner: ^2.4.6
  flutter_riverpod: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
    - .env.development
    - .env.staging
    - .env.production

  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
